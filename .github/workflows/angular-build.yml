name: Angular first workflow
on: push
jobs:
    build-angular:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout on VM
              uses: actions/checkout@v4

            - name: setup node js
              uses: actions/node-setup@v4
              with: 
                node-version: 22
                cache: npm 
                
            - name: install dependencies;
              run: npm install

            - name: make build;
              run: npm run build